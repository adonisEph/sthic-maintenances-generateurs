  <title>Gestion Maintenance &amp; Vidanges</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Thème « Marine » (mazalafirm.com) : ORANGE = couleur principale
    // (#D97706 / #F59E0B), BLEU DE NUIT = profondeur (#1E3A5F → #0D1F33),
    // fond papier bleuté #F4F7FA. L'échelle indigo porte l'identité :
    // teintes 50-700 = famille orange (actions, accents), 800-950 = nuit
    // (en-têtes, surfaces foncées). sky/blue = famille nuit.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F4F7FA',
            indigo: { 50:'#FFF8F0',100:'#FEEBD7',200:'#FBD9AE',300:'#F5BE7A',400:'#EE9B45',500:'#F59E0B',600:'#D97706',700:'#B45309',800:'#1E3A5F',900:'#17304E',950:'#0D1F33' },
            sky:    { 50:'#EFF6FC',100:'#DEEDF8',200:'#C0DBF0',300:'#90C0E4',400:'#5B82BB',500:'#3B66A0',600:'#2B5285',700:'#1E3A5F',800:'#17304E',900:'#12263E',950:'#0C1B2D' },
            blue:   { 50:'#EFF6FC',100:'#DEEDF8',200:'#C0DBF0',300:'#90C0E4',400:'#5B82BB',500:'#3B66A0',600:'#2B5285',700:'#1E3A5F',800:'#17304E',900:'#12263E',950:'#0C1B2D' }
          }
        }
      }
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
